<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reconditioning · 4barrel OS</title><link rel="icon" href="https://www.aexperiences.com/4barrel_OS.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fourbarrel.css"></head><body>
<script src="fourbarrel.js"></script>
<script>
(function () {
  var F = window.FB, c = F.mount({ active:"recon.html", crumb:"Reconditioning" }), d = F.db();
  c.appendChild(F.page("Reconditioning","The shop pipeline — and the gate. A unit can\'t hit the line until recon reads Ready. Recon cost isn\'t a separate bucket; it rolls straight into the unit\'s all-in, so you always know what a car is truly into you.",
    '<span class="tag crim">line gate</span>'));

  var inShop = d.units.filter(function(u){ return u.recon!=="Ready"; });
  var blocked = F.listBlocked(d);
  c.appendChild(F.card('<div class="between"><div><h2>In the shop</h2><div class="card-sub">Waiting · In shop · Waiting parts · Ready. The owner wants two of these on the line — the gate holds them.</div></div><div>'+F.tag(blocked.length+" held from line","crim")+'</div></div>'+
    (inShop.length ?
    '<table><thead><tr><th>Unit</th><th style="width:140px">Recon</th><th style="text-align:right">Recon cost</th><th>On the line?</th></tr></thead><tbody>'+
    inShop.map(function(u){ var can=F.canList(u);
      return '<tr><td><div class="t-main">'+F.esc(u.year+" "+u.make+" "+u.model)+'</div><div class="t-sub">'+F.esc(u.stock+" · "+u.note)+'</div></td>'+
      '<td><span class="chip hold">'+F.esc(u.recon)+'</span></td>'+
      '<td style="text-align:right" class="mono">'+F.money((u.reconParts||0)+(u.reconLabor||0))+'</td>'+
      '<td>'+(can?'<span class="chip clear">✓ cleared</span>':'<span class="chip hold">✗ held by the gate</span>')+'</td></tr>'; }).join("")+'</tbody></table>'
    : '<div class="empty">The shop is clear — every unit is Ready for the line.</div>')+
    '<div class="fence crim" style="margin-top:12px"><b>Why the gate matters.</b> List a car before it\'s reconditioned and you\'ve advertised something you can\'t deliver clean — a bad review, a comeback, or worse. The gate keeps a not-Ready unit off Cars.com until the work is done.</div>'));

  /* ready units feeding the line */
  var ready = d.units.filter(function(u){ return u.recon==="Ready"; });
  c.appendChild(F.card('<h2>Cleared for the line</h2><div class="card-sub">Reconditioned and sellable. Recon cost is already in each unit\'s all-in.</div>'+
    '<table><thead><tr><th>Unit</th><th style="text-align:right">Recon in all-in</th><th>Listed</th></tr></thead><tbody>'+
    ready.map(function(u){ return '<tr><td class="t-main">'+F.esc(u.year+" "+u.make+" "+u.model)+'</td><td style="text-align:right" class="mono">'+F.money((u.reconParts||0)+(u.reconLabor||0))+'</td><td>'+(u.listed?'<span class="chip clear">on the line</span>':'<span class="chip hold">not yet</span>')+'</td></tr>'; }).join("")+'</tbody></table>'+F.srcNote(F.BENCH.recon.src)));
})();
</script></body></html>
