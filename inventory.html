<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lot & Inventory · 4barrel OS</title><link rel="icon" href="https://www.aexperiences.com/4barrel_OS.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fourbarrel.css"></head><body>
<script src="fourbarrel.js"></script>
<script>
(function () {
  var F = window.FB, c = F.mount({ active:"inventory.html", crumb:"Lot & Inventory" }), d = F.db();
  c.appendChild(F.page("Lot & Inventory","Every unit with its running ALL-IN cost — not a static \"cost\" number, but auction hammer + fees + transport + recon + the floor-plan carry that grows every day it sits. This is what a franchise DMS never shows a small lot."));

  var un = F.unsold(d);
  c.appendChild(F.card('<h2>The lot</h2><div class="card-sub">'+un.length+' units in stock. Aging and title-in-transit flagged.</div>'+
    '<table><thead><tr><th>Unit</th><th>Miles</th><th style="text-align:right">Price</th><th style="text-align:right">All-in</th><th style="text-align:right">Front</th><th>Recon</th><th>Days</th><th>Title</th></tr></thead><tbody>'+
    un.map(function(u){ var fp=F.frontPotential(u), old=(u.daysOnLot>=35), listBlk=(u.wantList&&!F.canList(u));
      return '<tr><td><div class="t-main">'+F.esc(u.year+" "+u.make+" "+u.model+" "+u.trim)+'</div><div class="t-sub">'+F.esc(u.stock+" · "+u.color+" · "+u.src)+'</div></td>'+
      '<td class="mono small">'+u.mileage.toLocaleString()+'</td>'+
      '<td style="text-align:right" class="mono">'+F.money(u.price)+'</td>'+
      '<td style="text-align:right" class="mono">'+F.money(F.allInCost(u))+'</td>'+
      '<td style="text-align:right" class="mono"><b style="color:'+(fp>1500?'var(--good)':'var(--watch)')+'">'+F.money(fp)+'</b></td>'+
      '<td>'+(u.recon==="Ready"?'<span class="chip clear">Ready</span>':'<span class="chip hold">'+F.esc(u.recon)+'</span>')+(listBlk?' <span class="tag crim">held</span>':'')+'</td>'+
      '<td>'+F.tag(u.daysOnLot+"d", old?"crim":"ghost")+'</td>'+
      '<td>'+(u.titleInHand?'<span class="chip clear">in hand</span>':'<span class="chip hold">in transit</span>')+'</td></tr>'; }).join("")+'</tbody></table>'+
    '<div class="fence" style="margin-top:12px"><b>All-in is the truth.</b> The Outback shows a $1,600 front at the asking price — but 48 days of carry already came out of it. That\'s why days-on-lot is a bill, not a stat. <a href="floorplan.html">See the carry →</a></div>'));

  /* what it replaces */
  c.appendChild(F.card('<h2>What this replaces</h2><div class="card-sub">The stack a small lot cobbles together — folded into one unit record.</div>'+
    '<table><thead><tr><th>Today</th><th>The job</th><th>What it costs you</th></tr></thead><tbody>'+
    F.REPLACES.map(function(r){return '<tr><td class="t-main">'+F.esc(r.tool)+'</td><td>'+F.esc(r.job)+'</td><td class="muted small">'+F.esc(r.cost)+'</td></tr>';}).join("")+'</tbody></table>'));
})();
</script></body></html>
