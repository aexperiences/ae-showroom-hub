<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desk & Deals · 4barrel OS</title><link rel="icon" href="https://www.aexperiences.com/4barrel_OS.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fourbarrel.css"></head><body>
<script src="fourbarrel.js"></script>
<script>
(function () {
  var F = window.FB, c = F.mount({ active:"deals.html", crumb:"Desk & Deals" }), d = F.db();
  c.appendChild(F.page("Desk & Deals","The desk — cash, outside finance, dealer-arranged, or your own note. Front gross is sale price minus the true all-in (carry included), not minus a static cost. Back gross is where the deal structure decides how much is really there."));

  c.appendChild(F.card('<h2>How the deals structure</h2><div class="card-sub">Each one decides how much back gross is honestly on the table.</div>'+
    '<div class="grid g2" style="margin-top:6px">'+F.DEAL_STRUCTS.map(function(s){return '<div class="minicard"><div class="mc-h">'+F.esc(s.name)+'</div><div class="mc-b">'+F.esc(s.note)+'</div></div>';}).join("")+'</div>'));

  c.appendChild(F.card('<div class="between"><div><h2>The deal board</h2><div class="card-sub">Delivered and pending. The Escape is on the desk but the paperwork gate holds its delivery.</div></div><div>'+F.tag(F.deliveredDeals(d).length+" delivered","good")+'</div></div>'+
    '<table><thead><tr><th>Deal</th><th>Structure</th><th style="text-align:right">Sale</th><th style="text-align:right">Front</th><th style="text-align:right">Back</th><th style="text-align:right">Total</th><th>Status</th></tr></thead><tbody>'+
    d.deals.map(function(x){ var structName=(F.DEAL_STRUCTS.filter(function(s){return s.k===x.struct;})[0]||{}).name||x.struct;
      return '<tr><td><div class="t-main">'+F.esc(x.vehicle)+'</div><div class="t-sub">'+F.esc(x.num+" · "+x.buyer)+'</div></td>'+
      '<td><span class="mono small">'+F.esc(structName)+'</span></td>'+
      '<td style="text-align:right" class="mono">'+F.money(x.salePrice)+'</td>'+
      '<td style="text-align:right" class="mono">'+F.money(F.dealFront(x))+'</td>'+
      '<td style="text-align:right" class="mono">'+F.money(F.dealBack(x))+'</td>'+
      '<td style="text-align:right" class="mono"><b>'+F.money(F.dealTotal(x))+'</b></td>'+
      '<td>'+F.tag(x.delivered?"delivered":(F.canDeliver(x)?"ready":"blocked"), x.delivered?"good":(F.canDeliver(x)?"good":"crim"))+'</td></tr>'; }).join("")+
    '<tr class="totrow"><td><b>Delivered store gross</b></td><td></td><td></td><td></td><td></td><td style="text-align:right" class="mono"><b>'+F.money(F.storeGross(d))+'</b></td><td>'+F.tag("PVR "+F.money(F.avgPVR(d)),"mag")+'</td></tr>'+
    '</tbody></table>'+F.srcNote(F.BENCH.pvr.src)+
    '<div class="fence" style="margin-top:12px"><b>Front is honest here.</b> Every front gross is the sale price minus what the unit was truly into you — carry included. That\'s a number a franchise DMS smooths over, and it\'s the one that tells a small lot the truth.</div>'));
})();
</script></body></html>
