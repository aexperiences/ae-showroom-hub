<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Deals</title>
<link rel="icon" href="/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<style>
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink,#1b1e23);background:var(--paper,#f4f4f2);min-height:100vh}
  h1,h2,h3{font-family:Georgia,serif;font-weight:800;margin:0}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 20px 70px}
  .eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
  .stat .n{font-family:Georgia,serif;font-weight:800;font-size:20px;color:#2f6a52}
  .stat .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
  .sp{flex:1}
  .btn{background:linear-gradient(180deg,#2f6a52,#255740);color:#f2fbf6;border:none;border-radius:10px;padding:11px 17px;font-weight:700;font-family:Georgia,serif;font-size:14px;cursor:pointer}
  .list{display:flex;flex-direction:column;gap:9px}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 3px 10px rgba(20,30,40,.04);transition:.12s}
  .row:hover{border-color:#2f6a52;transform:translateY(-1px)}
  .row .veh{flex:1;min-width:0}
  .row .veh .t{font-weight:700;font-size:14.5px}
  .row .veh .s{font-size:11.5px;color:var(--mut);margin-top:2px}
  .row .col{text-align:right;min-width:74px}
  .row .col .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
  .row .col .v{font-family:Georgia,serif;font-weight:800;font-size:15px}
  .gross{color:#2f6a52}
  .scrim{position:fixed;inset:0;background:rgba(15,20,25,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
  .scrim.on{display:flex}
  .modal{background:var(--card);border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .modal h2{color:#2f6a52;font-size:20px;margin-bottom:6px}
  .grosspv{font-size:13px;color:var(--ink2);margin-bottom:12px}
  .fld{margin-bottom:9px}.fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:700;margin-bottom:4px}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit;font-size:13.5px;background:var(--paper);color:var(--ink)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .mrow{display:flex;gap:9px;margin-top:14px}
  .mini{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink2)}
  .del{color:#b23b3b;border-color:#e6c0c0}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2f6a52!important;outline-offset:2px}
</style>
</head>
<body>
<script src="/hub-nav.js" defer></script>
<script src="/showdata.js"></script>
<script src="/assistant.js" defer></script>
<div class="wrap">
  <div class="eyebrow">4barrel OS</div>
  <h1>Deals</h1>
  <div class="bar">
    <div class="stat"><div class="n" id="dUnits">—</div><div class="l">Units sold</div></div>
    <div class="stat"><div class="n" id="dGross">—</div><div class="l">Total gross</div></div>
    <div class="stat"><div class="n" id="dAvg">—</div><div class="l">Avg gross / unit</div></div>
    <div class="stat"><div class="n" id="dFi">—</div><div class="l">F&amp;I total</div></div>
    <div class="sp"></div>
    <button class="btn" onclick="openNew()">＋ Log a sale</button>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="scrim" id="scrim" onclick="if(event.target===this)close2()"><div class="modal">
  <h2 id="mTitle">Log a sale</h2>
  <div class="grosspv" id="grossPv">Gross: —</div>
  <div class="two"><div class="fld"><label>Vehicle</label><input id="f_vehicle" placeholder="2020 Audi A4 Premium"></div>
    <div class="fld"><label>Stock #</label><input id="f_stock"></div></div>
  <div class="two"><div class="fld"><label>Buyer</label><input id="f_buyer"></div>
    <div class="fld"><label>Salesperson</label><input id="f_salesperson"></div></div>
  <div class="three"><div class="fld"><label>Sale price ($)</label><input id="f_salePrice" type="number" oninput="pv()"></div>
    <div class="fld"><label>Cost ($)</label><input id="f_cost" type="number" oninput="pv()"></div>
    <div class="fld"><label>Recon ($)</label><input id="f_reconCost" type="number" oninput="pv()"></div></div>
  <div class="two"><div class="fld"><label>F&amp;I ($)</label><input id="f_fi" type="number"></div>
    <div class="fld"><label>Sold date</label><input id="f_soldDate" type="date"></div></div>
  <div class="fld"><label>Notes</label><textarea id="f_notes" style="min-height:48px"></textarea></div>
  <div class="mrow"><button class="btn" style="flex:1" onclick="saveIt()">Save</button><button class="mini del" id="delBtn" onclick="delIt()">Delete</button><button class="mini" onclick="close2()">Cancel</button></div>
</div></div>

<script>
(function(){
  var el=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var money=function(n){n=+n||0;return '$'+Math.round(n).toLocaleString();};
  var DEALS=[], CUR=null;
  function grossOf(d){ return (+d.salePrice||0)-(+d.cost||0)-(+d.reconCost||0); }

  function load(){ window.SR.list('deals').then(function(a){ DEALS=a||[]; render(); }); }
  function render(){
    DEALS.sort(function(a,b){return (b.soldDate||'').localeCompare(a.soldDate||'');});
    el('dUnits').textContent=DEALS.length;
    var g=DEALS.reduce(function(s,d){return s+grossOf(d);},0);
    el('dGross').textContent=money(g);
    el('dAvg').textContent=DEALS.length?money(g/DEALS.length):'—';
    el('dFi').textContent=money(DEALS.reduce(function(s,d){return s+(+d.fi||0);},0));
    el('list').innerHTML=DEALS.length?DEALS.map(row).join(''):'<div style="color:var(--mut);font-size:13px">No deals logged yet.</div>';
    el('list').querySelectorAll('[data-id]').forEach(function(c){c.addEventListener('click',function(){openEdit(c.getAttribute('data-id'));});});
  }
  function row(d){
    return '<div class="row" data-id="'+esc(d.id)+'"><div class="veh"><div class="t">'+esc(d.vehicle||'—')+'</div>'+
      '<div class="s">'+esc(d.buyer||'')+(d.salesperson?' · '+esc(d.salesperson):'')+(d.soldDate?' · '+esc(d.soldDate):'')+(d.stock?' · #'+esc(d.stock):'')+'</div></div>'+
      '<div class="col"><div class="k">Sale</div><div class="v">'+money(d.salePrice)+'</div></div>'+
      '<div class="col"><div class="k">F&I</div><div class="v">'+money(d.fi)+'</div></div>'+
      '<div class="col"><div class="k">Gross</div><div class="v gross">'+money(grossOf(d))+'</div></div></div>';
  }
  var F=['vehicle','stock','buyer','salesperson','salePrice','cost','reconCost','fi','soldDate','notes'];
  var NUM={salePrice:1,cost:1,reconCost:1,fi:1};
  function pv(){ var g=(+el('f_salePrice').value||0)-(+el('f_cost').value||0)-(+el('f_reconCost').value||0); el('grossPv').innerHTML='Gross: <b style="color:#2f6a52">'+money(g)+'</b>'; }
  function openNew(){ CUR=null; el('mTitle').textContent='Log a sale'; F.forEach(function(k){el('f_'+k).value='';}); el('f_soldDate').value=new Date().toISOString().slice(0,10); el('delBtn').style.display='none'; pv(); el('scrim').classList.add('on'); el('f_vehicle').focus(); }
  function openEdit(id){ CUR=DEALS.find(function(x){return x.id===id;}); if(!CUR)return; el('mTitle').textContent='Edit deal'; F.forEach(function(k){el('f_'+k).value=CUR[k]==null?'':CUR[k];}); el('delBtn').style.display=''; pv(); el('scrim').classList.add('on'); }
  function saveIt(){ var rec=CUR?Object.assign({},CUR):{}; F.forEach(function(k){var v=el('f_'+k).value; if(NUM[k])v=v===''?'':+v; rec[k]=v;}); rec.gross=grossOf(rec); window.SR.save('deals',rec).then(function(){close2();load();}); }
  function delIt(){ if(!CUR||!confirm('Delete this deal?'))return; window.SR.del('deals',CUR.id).then(function(){close2();load();}); }
  function close2(){ el('scrim').classList.remove('on'); }
  window.openNew=openNew;window.saveIt=saveIt;window.delIt=delIt;window.close2=close2;window.pv=pv;

  window.AssistantContext=function(){ return { view:'deals / sold', units:DEALS.length, totalGross:DEALS.reduce(function(s,d){return s+grossOf(d);},0), deals:DEALS.slice(0,24).map(function(d){return {vehicle:d.vehicle,buyer:d.buyer,salePrice:d.salePrice,gross:grossOf(d),fi:d.fi,soldDate:d.soldDate,salesperson:d.salesperson};}) }; };
  load();
})();
</script>
</body>
</html>
